# Three neons on black. Blue = up / pass, pink = down / fail, green = attention.
# Nothing else gets a colour, so a colour on this screen always means something.
[theme]
base                     = "dark"
primaryColor             = "#39FF14"
backgroundColor          = "#04060A"
secondaryBackgroundColor = "#080C12"
textColor                = "#D5E6F2"
font                     = "monospace"

[browser]
gatherUsageStats = false

[server]
headless = false
